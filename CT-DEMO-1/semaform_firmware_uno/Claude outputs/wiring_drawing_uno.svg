<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1280" viewBox="0 0 680 640" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Semaform wiring drawing, Arduino Uno final build</title><desc>A laptop connects over USB to an Arduino Uno. Digital pins 9, 6, 5 and 3 send PWM signals to four SG92R servos. A 5 V 3 A power supply feeds a breadboard power rail that powers the servos, and the Uno GND is tied to the negative rail. An inset shows where each of the three servo wires goes.</desc>
